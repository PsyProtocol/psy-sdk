[package]
name = "qed_dev_cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "qed_dev_cli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
dotenv = "0.15"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# QED dependencies
qed_rollup_utils = { path = "../qed_rollup_utils" }
qed_core = { path = "../qed_core" }
qed_data = { path = "../qed_data" }
qed_crypto = { path = "../qed_crypto" }
qed_store = { path = "../qed_store" }
qed_node = { path = "../qed_node" }
qed_rollup_circuit = { path = "../qed_rollup_circuit" }
qed_common_circuit = { path = "../qed_common_circuit" }
qed_prover = { path = "../qed_prover" }
kvq = { path = "../kvq" }
qedlang_core = { path = "../qedlang_core" }
qedlang_macros = { path = "../qed_compiler/qedlang_macros" }
qed_exec = { path = "../qed_exec" }

# Additional dependencies
fred = { workspace = true }
bincode = "1.3"
hex = "0.4"
rand = "0.8"

# Plonky2
plonky2 = { workspace = true }

[[bin]]
name = "qed_dev_cli"
path = "src/main.rs"