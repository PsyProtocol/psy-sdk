[package]
edition = "2021"
name    = "qed_store"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow     = { workspace = true }
hashbrown      = { workspace = true }
serde      = { workspace = true }
serde_json      = { workspace = true }
serde_with = { workspace = true }
hex = { workspace = true }
hex-literal = { workspace = true }
lazy_static = { workspace = true }
async-trait = { workspace = true }
plonky2 = { workspace = true }
twox-hash = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true }
clap = { workspace = true }

kvq = { path = "../kvq" }
qed_core = { path = "../qed_core" }
qed_data = { path = "../qed_data" }
qed_crypto = { path = "../qed_crypto" }
thiserror = { workspace = true }
maybe-async = { workspace = true }

# ScyllaDB support - only for non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
scylla = { version = "0.15.1" }
futures = { version = "0.3.0" }
tokio = { version = "1.43.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }

[features]
default = ["is_sync"]
is_sync = ["maybe-async/is_sync"]

[dev-dependencies]
tempfile = "3.0"
kvq_store_lmdbx = { path = "../kvq_store_lmdbx" }
futures = "0.3"

[[test]]
name = "kvq_store_tests"
path = "tests/scylla/kvq_store_tests.rs"

[[test]]
name = "test_checkpoint_get_leq"
path = "tests/scylla/test_checkpoint_get_leq.rs"

[[test]]
name = "kvq_batch_tests"
path = "tests/scylla/kvq_batch_tests.rs"

[[test]]
name = "test_batch_operations"
path = "tests/scylla/test_batch_operations.rs"

[[test]]
name = "test_performance_comparison"
path = "tests/scylla/test_performance_comparison.rs"

[[test]]
name = "test_clustering_optimizations"
path = "tests/scylla/test_clustering_optimizations.rs"

[[test]]
name = "test_debug_get_leq"
path = "tests/scylla/test_debug_get_leq.rs"

[[test]]
name = "test_performance_detailed"
path = "tests/scylla/test_performance_detailed.rs"
