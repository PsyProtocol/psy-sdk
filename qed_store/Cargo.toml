[package]
edition = "2021"
name    = "qed_store"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_repr = { workspace = true }
bincode = { workspace = true }
anyhow     = { workspace = true }
hashbrown      = { workspace = true }
serde      = { workspace = true }
serde_json      = { workspace = true }
async-trait = { workspace = true }
auto_impl = { workspace = true }
ambassador = { workspace = true }
plonky2 = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true }
clap = { workspace = true }

kvq = { workspace = true }
qed_core = { workspace = true }
qed_data = { workspace = true }
qed_crypto = { workspace = true }
thiserror = { workspace = true }
maybe-async = { workspace = true }

# ScyllaDB support - only for non-WASM targets
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
scylla = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
kvq_store_lmdbx = { path = "src/store/lmdbx" }
tikv-client = { workspace = true }
# Redis and queue dependencies
fred = { workspace = true }
redis = { workspace = true }
bb8-redis = { workspace = true }
bb8 = { workspace = true }
rsmq = { workspace = true }
url = { workspace = true }
chrono = {workspace = true}
rand = { workspace = true }

[features]
default = ["is_sync"]
is_sync = ["maybe-async/is_sync"]

[dev-dependencies]
tempfile = { workspace = true }
futures = { workspace = true }

[[test]]
name = "tikv_store_tests"
path = "tests/tikv/tikv_store_tests.rs"

[[test]]
name = "kvq_store_tests"
path = "tests/scylla/kvq_store_tests.rs"

[[test]]
name = "test_checkpoint_get_leq"
path = "tests/scylla/test_checkpoint_get_leq.rs"

[[test]]
name = "kvq_batch_tests"
path = "tests/scylla/kvq_batch_tests.rs"

[[test]]
name = "test_batch_operations"
path = "tests/scylla/test_batch_operations.rs"

[[test]]
name = "test_performance_comparison"
path = "tests/scylla/test_performance_comparison.rs"

[[test]]
name = "test_clustering_optimizations"
path = "tests/scylla/test_clustering_optimizations.rs"

[[test]]
name = "test_debug_get_leq"
path = "tests/scylla/test_debug_get_leq.rs"

[[test]]
name = "test_performance_detailed"
path = "tests/scylla/test_performance_detailed.rs"
