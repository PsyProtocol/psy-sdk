            echo 'ECS_INSTANCE_ATTRIBUTES={"realm":"realm16384"}' >> /etc/ecs/ecs.config
            
            # Start ECS agent
            systemctl enable ecs
            systemctl start ecs
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 100
              VolumeType: gp3
              Iops: 3000
              Throughput: 125
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub ${ProjectName}-realm16384
              - Key: Project
                Value: !Ref ProjectName
              - Key: Environment
                Value: !Ref Environment

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${ProjectName}-vpc-id

  CoordinatorSubnetId:
    Description: Coordinator Subnet ID
    Value: !Ref CoordinatorSubnet
    Export:
      Name: !Sub ${ProjectName}-coordinator-subnet-id

  Realm0SubnetId:
    Description: Realm 0 Subnet ID
    Value: !Ref Realm0Subnet
    Export:
      Name: !Sub ${ProjectName}-realm0-subnet-id

  Realm16384SubnetId:
    Description: Realm 16384 Subnet ID
    Value: !Ref Realm16384Subnet
    Export:
      Name: !Sub ${ProjectName}-realm16384-subnet-id

  CoordinatorSecurityGroupId:
    Description: Coordinator Security Group ID
    Value: !Ref CoordinatorSecurityGroup
    Export:
      Name: !Sub ${ProjectName}-coordinator-sg

  Realm0SecurityGroupId:
    Description: Realm 0 Security Group ID
    Value: !Ref Realm0SecurityGroup
    Export:
      Name: !Sub ${ProjectName}-realm0-sg

  Realm16384SecurityGroupId:
    Description: Realm 16384 Security Group ID
    Value: !Ref Realm16384SecurityGroup
    Export:
      Name: !Sub ${ProjectName}-realm16384-sg

  # Redis endpoints are stored in SSM Parameter Store by the initialization script
  # The following parameters are available:
  # /${ProjectName}/redis/coordinator/endpoint
  # /${ProjectName}/redis/realm0/endpoint
  # /${ProjectName}/redis/realm16384/endpoint
  
  # ScyllaDB endpoints are stored in SSM Parameter Store by the initialization script
  # The following parameters are available:
  # /${ProjectName}/scylladb/cluster-contact-point
  # /${ProjectName}/scylladb/node-<instance-id>/endpoint
  
  ScyllaDBAutoScalingGroupName:
    Description: ScyllaDB Auto Scaling Group Name
    Value: !Ref ScyllaDBAutoScalingGroup
    Export:
      Name: !Sub ${ProjectName}-scylladb-asg

  ECSClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub ${ProjectName}-cluster-name

  ALBDNSName:
    Description: ALB DNS Name
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub ${ProjectName}-alb-dns

  ALBArn:
    Description: ALB ARN
    Value: !Ref ALB
    Export:
      Name: !Sub ${ProjectName}-alb-arn

  CoordinatorEBSVolumeId:
    Description: EBS Volume ID for Coordinator
    Value: !Ref CoordinatorEBSVolume
    Export:
      Name: !Sub ${ProjectName}-coordinator-ebs-volume-id

  Realm0EBSVolumeId:
    Description: EBS Volume ID for Realm 0
    Value: !Ref Realm0EBSVolume
    Export:
      Name: !Sub ${ProjectName}-realm0-ebs-volume-id

  Realm16384EBSVolumeId:
    Description: EBS Volume ID for Realm 16384
    Value: !Ref Realm16384EBSVolume
    Export:
      Name: !Sub ${ProjectName}-realm16384-ebs-volume-id

  # Redis Auto Scaling Group Outputs
  RedisAutoScalingGroupName:
    Description: Redis Auto Scaling Group Name
    Value: !Ref RedisAutoScalingGroup
    Export:
      Name: !Sub ${ProjectName}-redis-asg-name

  RedisLaunchTemplateName:
    Description: Redis Launch Template Name
    Value: !Ref RedisLaunchTemplate
    Export:
      Name: !Sub ${ProjectName}-redis-launch-template

  # Redis Configuration Info
  RedisInfo:
    Description: Redis endpoint information
    Value: !Sub |
      Redis endpoints will be available in SSM Parameter Store after instances initialize:
      - /${ProjectName}/redis/coordinator/endpoint (port 6379)
      - /${ProjectName}/redis/realm0/endpoint (port 6380)
      - /${ProjectName}/redis/realm16384/endpoint (port 6381)

  # ScyllaDB Configuration Info
  ScyllaDBInfo:
    Description: ScyllaDB endpoint information
    Value: !Sub |
      ScyllaDB endpoints will be available in SSM Parameter Store after instances initialize:
      - /${ProjectName}/scylladb/coordinator-endpoint
      - /${ProjectName}/scylladb/realm0-endpoint  
      - /${ProjectName}/scylladb/realm16384-endpoint
      - /${ProjectName}/scylladb/cluster-contact-point