  # Launch Templates (only for coordinator and edge services that need EFS)
  CoordinatorLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${ProjectName}-coordinator-template
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref WorkerInstanceType
        KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref AWS::NoValue]
        IamInstanceProfile:
          Name: !Ref WorkerInstanceProfile
        NetworkInterfaces:
          - DeviceIndex: 0
            DeleteOnTermination: true
            Groups:
              - !Ref CoordinatorSecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e
            
            # Update system
            apt-get update -y
            apt-get upgrade -y
            
            # Install required packages
            apt-get install -y docker.io awscli nvme-cli
            systemctl enable docker
            systemctl start docker
            usermod -aG docker ubuntu
            
            # Attach and mount EBS Multi-Attach volume
            echo "Attaching EBS volume for coordinator data..."
            INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
            
            # Attach EBS volume
            echo "Attaching EBS volume ${CoordinatorEBSVolume}..."
            aws ec2 attach-volume \
              --volume-id ${CoordinatorEBSVolume} \
              --instance-id $INSTANCE_ID \
              --device /dev/xvdf \
              --region ${AWS::Region} || { echo "Failed to attach EBS volume"; exit 1; }
            
            # Wait for volume to be attached using improved detection for Nitro instances
            echo "Waiting for EBS volume to be attached..."
            START_TIME=$(date +%s)
            DEVICE_NAME=""
            
            while [ -z "$DEVICE_NAME" ]; do
              # For Nitro instances, check both NVMe and traditional device names
              # Look for newly attached devices (not the root device)
              
              # Method 1: Check for NVMe devices (most likely on Nitro instances)
              for nvme_dev in /dev/nvme*n1; do
                if [ -b "$nvme_dev" ] && [ "$nvme_dev" != "/dev/nvme0n1" ]; then
                  # Verify this is our attached volume by checking if it's not already mounted
                  if ! mount | grep -q "$nvme_dev"; then
                    DEVICE_NAME="$nvme_dev"
                    echo "Found NVMe device: $DEVICE_NAME"
                    break
                  fi
                fi
              done
              
              # Method 2: Fallback to traditional device names if no NVMe found
              if [ -z "$DEVICE_NAME" ]; then
                for xvd_dev in /dev/xvd[f-z]; do
                  if [ -b "$xvd_dev" ]; then
                    DEVICE_NAME="$xvd_dev"
                    echo "Found traditional device: $DEVICE_NAME"
                    break
                  fi
                done
              fi
              
              ELAPSED=$(( $(date +%s) - $START_TIME ))
              if [ $ELAPSED -gt 300 ]; then
                echo "ERROR: Timeout waiting for EBS device after 300s"
                echo "Available block devices:"
                lsblk -d -o NAME,TYPE,SIZE,STATE
                echo "NVMe devices:"
                ls -la /dev/nvme* 2>/dev/null || echo "No NVMe devices found"
                echo "Traditional devices:"
                ls -la /dev/xvd* 2>/dev/null || echo "No traditional devices found"
                exit 1
              fi
              
              if [ -z "$DEVICE_NAME" ]; then
                echo "Waiting for EBS device to appear... ($ELAPSED s elapsed)"
                sleep 5
              fi
            done
            
            echo "Final detected EBS device: $DEVICE_NAME"
            
            # Check if volume needs formatting (only format if empty)
            if ! file -s "$DEVICE_NAME" | grep -q "filesystem"; then
              echo "Formatting EBS volume with ext4..."
              mkfs.ext4 -F "$DEVICE_NAME" || { echo "Failed to format EBS volume"; exit 1; }
            else
              echo "EBS volume already formatted"
            fi
            
            # Create mount point and mount
            mkdir -p /data/coordinator
            # For Multi-Attach volumes, use specific mount options to prevent cache issues
            mount -o noatime,nodiratime "$DEVICE_NAME" /data/coordinator || { echo "Failed to mount EBS volume"; exit 1; }
            
            # Add to fstab for persistent mounting (use UUID for reliability)
            VOLUME_UUID=$(blkid -s UUID -o value "$DEVICE_NAME")
            if [ -n "$VOLUME_UUID" ]; then
              echo "UUID=$VOLUME_UUID /data/coordinator ext4 defaults,noatime 0 0" >> /etc/fstab
            else
              echo "$DEVICE_NAME /data/coordinator ext4 defaults,noatime 0 0" >> /etc/fstab
            fi
            
            # Verify mount
            if ! mountpoint -q /data/coordinator; then
              echo "ERROR: EBS mount failed"; exit 1
            fi
            
            # Set permissions for QED data
            chown -R 1001:1001 /data/coordinator
            
            # Install ECS agent
            curl -O https://s3.amazonaws.com/amazon-ecs-agent-us-east-1/amazon-ecs-init-latest.amd64.deb
            dpkg -i amazon-ecs-init-latest.amd64.deb || apt-get install -f -y
            
            # Configure ECS
            mkdir -p /etc/ecs
            echo ECS_CLUSTER=${ProjectName}-cluster >> /etc/ecs/ecs.config
            echo ECS_ENABLE_TASK_IAM_ROLE=true >> /etc/ecs/ecs.config
            echo ECS_ENABLE_TASK_IAM_ROLE_NETWORK_HOST=true >> /etc/ecs/ecs.config
            echo ECS_ENABLE_CONTAINER_METADATA=true >> /etc/ecs/ecs.config
            echo 'ECS_INSTANCE_ATTRIBUTES={"realm":"coordinator"}' >> /etc/ecs/ecs.config
            
            # Start ECS agent
            systemctl enable ecs
            systemctl start ecs
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 100
              VolumeType: gp3
              Iops: 3000
              Throughput: 125
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub ${ProjectName}-coordinator
              - Key: Project
                Value: !Ref ProjectName
              - Key: Environment
                Value: !Ref Environment

