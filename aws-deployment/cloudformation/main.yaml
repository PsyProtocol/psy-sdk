AWSTemplateFormatVersion: '2010-09-09'
Description: 'QED Protocol AWS Deployment - Main Infrastructure with Realm Isolation (Simplified Network)'

Parameters:
  ProjectName:
    Type: String
    Default: qed-protocol
    Description: Name of the project
  
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name
  
  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for VPC
  
  # Public Subnets (simplified - single AZ)
  CoordinatorSubnetCIDR:
    Type: String
    Default: 10.0.10.0/24
    Description: CIDR block for coordinator subnet
  
  Realm0SubnetCIDR:
    Type: String
    Default: 10.0.20.0/24
    Description: CIDR block for realm 0 subnet
  
  Realm16384SubnetCIDR:
    Type: String
    Default: 10.0.30.0/24
    Description: CIDR block for realm 16384 subnet
  
  WorkerInstanceType:
    Type: String
    Default: c6i.4xlarge
    AllowedValues:
      - c6i.xlarge    # 4 vCPU, 8 GiB RAM
      - c6i.2xlarge   # 8 vCPU, 16 GiB RAM
      - c6i.4xlarge   # 16 vCPU, 32 GiB RAM  
      - c6i.8xlarge   # 32 vCPU, 64 GiB RAM
      - c6i.12xlarge  # 48 vCPU, 96 GiB RAM
      - c7i.2xlarge   # 8 vCPU, 16 GiB RAM (latest gen)
      - c7i.4xlarge   # 16 vCPU, 32 GiB RAM (latest gen)
    Description: EC2 instance type for high-performance workers
  
  KeyPairName:
    Type: String
    Default: ""
    Description: EC2 Key Pair for SSH access (optional)

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: Latest Ubuntu 22.04 LTS AMI
  
  ScyllaDBDataVolumeSize:
    Type: Number
    Default: 1000
    MinValue: 100
    MaxValue: 16000
    Description: Size of ScyllaDB data volume in GB
  
  ScyllaDBCommitLogVolumeSize:
    Type: Number
    Default: 200
    MinValue: 50
    MaxValue: 1000
    Description: Size of ScyllaDB commit log volume in GB
  
  ScyllaDBInstanceType:
    Type: String
    Default: r6i.2xlarge
    AllowedValues:
      - r6i.large     # 2 vCPU, 16 GiB RAM
      - r6i.xlarge    # 4 vCPU, 32 GiB RAM
      - r6i.2xlarge   # 8 vCPU, 64 GiB RAM
      - r6i.4xlarge   # 16 vCPU, 128 GiB RAM
    Description: EC2 instance type for ScyllaDB nodes
  
  ScyllaDBInstanceCount:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 9
    Description: Number of ScyllaDB instances

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, ""]]

Resources:
  # VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # Public Subnets (Different AZs for ALB requirement)
  CoordinatorSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref CoordinatorSubnetCIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-coordinator-subnet

  Realm0Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref Realm0SubnetCIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-realm0-subnet

  Realm16384Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [2, !GetAZs '']
      CidrBlock: !Ref Realm16384SubnetCIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-realm16384-subnet

  # Route Table for Public Subnets
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-routes

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  CoordinatorSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref CoordinatorSubnet

  Realm0SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref Realm0Subnet

  Realm16384SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref Realm16384Subnet

  # Security Groups
  CoordinatorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-coordinator-sg
      GroupDescription: Security group for coordinator services
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # SSH access
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        # Allow traffic from ALB
        - IpProtocol: tcp
          FromPort: 8545
          ToPort: 8545
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        # Allow ALB access to dynamic ports for ECS
        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 65535
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        # Allow internal coordinator communication
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: !Ref CoordinatorSubnetCIDR
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  Realm0SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-realm0-sg
      GroupDescription: Security group for realm 0 services
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # SSH access
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        # Allow traffic from ALB
        - IpProtocol: tcp
          FromPort: 8546
          ToPort: 8546
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        # Allow ALB access to dynamic ports for ECS
        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 65535
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        # Allow internal realm 0 communication
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: !Ref Realm0SubnetCIDR
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  Realm16384SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-realm16384-sg
      GroupDescription: Security group for realm 16384 services
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # SSH access
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        # Allow traffic from ALB
        - IpProtocol: tcp
          FromPort: 8547
          ToPort: 8547
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        # Allow ALB access to dynamic ports for ECS
        - IpProtocol: tcp
          FromPort: 32768
          ToPort: 65535
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        # Allow internal realm 16384 communication
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          CidrIp: !Ref Realm16384SubnetCIDR
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # Redis Security Groups
  CoordinatorRedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-coordinator-redis-sg
      GroupDescription: Security group for coordinator Redis
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: 10.0.0.0/16

  Realm0RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-realm0-redis-sg
      GroupDescription: Security group for realm 0 Redis
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 6380
          ToPort: 6380
          CidrIp: 10.0.0.0/16

  Realm16384RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-realm16384-redis-sg
      GroupDescription: Security group for realm 16384 Redis
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 6381
          ToPort: 6381
          CidrIp: 10.0.0.0/16

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-alb-sg
      GroupDescription: Security group for ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # HTTP access for all ports
        - IpProtocol: tcp
          FromPort: 8545
          ToPort: 8547
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ProjectName}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # ScyllaDB Security Group
  ScyllaDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ProjectName}-scylladb-sg
      GroupDescription: Security group for ScyllaDB cluster
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # SSH access
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        # ScyllaDB CQL port
        - IpProtocol: tcp
          FromPort: 9042
          ToPort: 9042
          CidrIp: 10.0.0.0/16
        # ScyllaDB inter-node communication
        - IpProtocol: tcp
          FromPort: 7000
          ToPort: 7001
          CidrIp: 10.0.0.0/16
        # ScyllaDB JMX port
        - IpProtocol: tcp
          FromPort: 7199
          ToPort: 7199
          CidrIp: 10.0.0.0/16
        # ScyllaDB REST API
        - IpProtocol: tcp
          FromPort: 10000
          ToPort: 10000
          CidrIp: 10.0.0.0/16
        # ScyllaDB Prometheus metrics
        - IpProtocol: tcp
          FromPort: 9180
          ToPort: 9180
          CidrIp: 10.0.0.0/16
        # ScyllaDB node exporter
        - IpProtocol: tcp
          FromPort: 9100
          ToPort: 9100
          CidrIp: 10.0.0.0/16
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ScyllaDB Launch Template
  ScyllaDBLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${ProjectName}-scylladb-lt
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref ScyllaDBInstanceType
        KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref AWS::NoValue]
        IamInstanceProfile:
          Name: !Ref WorkerInstanceProfile
        SecurityGroupIds:
          - !Ref ScyllaDBSecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 100
              VolumeType: gp3
              Iops: 16000
              Throughput: 1000
              DeleteOnTermination: true
          # Dedicated EBS volume for ScyllaDB data
          - DeviceName: /dev/xvdb
            Ebs:
              VolumeSize: !Ref ScyllaDBDataVolumeSize
              VolumeType: gp3
              Iops: 16000
              Throughput: 1000
              DeleteOnTermination: true
              Encrypted: true
          # Dedicated EBS volume for ScyllaDB commitlog
          - DeviceName: /dev/xvdc
            Ebs:
              VolumeSize: !Ref ScyllaDBCommitLogVolumeSize
              VolumeType: gp3
              Iops: 16000
              Throughput: 1000
              DeleteOnTermination: true
              Encrypted: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Project
                Value: !Ref ProjectName
              - Key: Component
                Value: scylladb
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e
            exec > /var/log/user-data.log 2>&1
            echo "Starting ScyllaDB setup at $(date)..."
            
            # Install cqlsh for ScyllaDB management
            apt-get update && apt-get install -y python3-pip
            pip3 install cassandra-driver cqlsh
            
            # Configure system settings for ScyllaDB
            echo "Configuring system settings for ScyllaDB..."
            
            # Set AIO max nr for ScyllaDB performance
            sysctl -w fs.aio-max-nr=5029568
            echo "fs.aio-max-nr=5029568" >> /etc/sysctl.conf
            
            # Disable swap
            swapoff -a
            sed -i '/ swap / s/^/#/' /etc/fstab
            
            # Update system and install Docker
            apt-get update -y
            apt-get install -y docker.io awscli jq xfsprogs
            systemctl enable docker
            systemctl start docker
            
            # Setup EBS volumes
            echo "Setting up EBS volumes..."
            
            # Wait for EBS volumes to be attached
            sleep 10
            
            # Support both xvd* and nvme* device naming
            DATA_DEVICE=""
            COMMITLOG_DEVICE=""
            
            # First check for traditional xvd* devices
            if [ -b /dev/xvdb ] && [ -b /dev/xvdc ]; then
              echo "Found traditional xvd* devices"
              DATA_DEVICE="/dev/xvdb"
              COMMITLOG_DEVICE="/dev/xvdc"
            else
              echo "Checking for NVMe devices..."
              # For newer instances, identify by size
              for device in /dev/nvme*n1; do
                if [ -b "$device" ]; then
                  SIZE=$(lsblk -b -n -o SIZE "$device" 2>/dev/null | head -1)
                  if [ -n "$SIZE" ]; then
                    SIZE_GB=$((SIZE / 1024 / 1024 / 1024))
                    if [ $SIZE_GB -eq 1000 ]; then
                      DATA_DEVICE="$device"
                    elif [ $SIZE_GB -eq 200 ]; then
                      COMMITLOG_DEVICE="$device"
                    fi
                  fi
                fi
              done
            fi
            
            echo "Data device: $DATA_DEVICE, Commitlog device: $COMMITLOG_DEVICE"
            
            # Exit if devices not found
            if [ -z "$DATA_DEVICE" ] || [ -z "$COMMITLOG_DEVICE" ]; then
              echo "ERROR: Could not identify EBS volumes"
              exit 1
            fi
            
            # Format EBS volumes with XFS
            mkfs.xfs -f "$DATA_DEVICE"
            mkfs.xfs -f "$COMMITLOG_DEVICE"
            
            # Create mount points
            mkdir -p /var/lib/scylla
            
            # Mount data volume first
            mount "$DATA_DEVICE" /var/lib/scylla
            
            # Now create commitlog directory on the mounted filesystem
            mkdir -p /var/lib/scylla/commitlog
            
            # Mount commitlog volume
            mount "$COMMITLOG_DEVICE" /var/lib/scylla/commitlog
            
            # Add to fstab for persistence
            echo "$DATA_DEVICE /var/lib/scylla xfs defaults,nofail,noatime 0 2" >> /etc/fstab
            echo "$COMMITLOG_DEVICE /var/lib/scylla/commitlog xfs defaults,nofail,noatime 0 2" >> /etc/fstab
            
            # Create data directories for Docker volumes
            mkdir -p /var/lib/scylla/data
            mkdir -p /var/lib/scylla/config
            
            # Set proper permissions (UID 999 for scylla user in container)
            chown -R 999:999 /var/lib/scylla
            
            # Get instance metadata
            INSTANCE_ID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id)
            INSTANCE_IP=$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)
            PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
            
            # Get other ScyllaDB nodes from Auto Scaling Group
            ASG_NAME="${ProjectName}-scylladb-asg"
            REGION="${AWS::Region}"
            
            # Wait a bit for other instances to start
            sleep 30
            
            # Get all instances in the ASG
            INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names $ASG_NAME \
              --region $REGION \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
              --output text)
            
            # Get IPs of all instances
            SEEDS=""
            for instance in $INSTANCES; do
              if [ "$instance" != "$INSTANCE_ID" ]; then
                IP=$(aws ec2 describe-instances \
                  --instance-ids $instance \
                  --region $REGION \
                  --query 'Reservations[0].Instances[0].PrivateIpAddress' \
                  --output text)
                if [ -n "$IP" ]; then
                  if [ -z "$SEEDS" ]; then
                    SEEDS="$IP"
                  else
                    SEEDS="$SEEDS,$IP"
                  fi
                fi
              fi
            done
            
            # If no other nodes, use self as seed
            if [ -z "$SEEDS" ]; then
              SEEDS="$INSTANCE_IP"
            fi
            
            # Pull ScyllaDB Docker image
            docker pull scylladb/scylla:2025.1
            
            # Start ScyllaDB container (standalone instance)
            docker run --name scylladb -d \
              --restart always \
              -p 9042:9042 \
              -p 9180:9180 \
              -p 9100:9100 \
              -v /var/lib/scylla/data:/var/lib/scylla \
              scylladb/scylla:2025.1
            
            # Wait for ScyllaDB to be ready
            echo "Waiting for ScyllaDB to start..."
            while ! cqlsh -e "DESC KEYSPACES" $INSTANCE_IP 9042 > /dev/null 2>&1; do
              sleep 5
            done
            
            # Store connection info in SSM
            aws ssm put-parameter \
              --name "/${ProjectName}/scylladb/node-$INSTANCE_ID/endpoint" \
              --value "$INSTANCE_IP:9042" \
              --type String \
              --overwrite \
              --region ${AWS::Region}
            
            # Also store based on subnet
            SUBNET_THIRD_OCTET=$(echo $INSTANCE_IP | cut -d. -f3)
            case $SUBNET_THIRD_OCTET in
              10)
                # Coordinator subnet
                aws ssm put-parameter \
                  --name "/${ProjectName}/scylladb/coordinator-endpoint" \
                  --value "$INSTANCE_IP:9042" \
                  --type String \
                  --overwrite \
                  --region ${AWS::Region}
                ;;
              20)
                # Realm0 subnet
                aws ssm put-parameter \
                  --name "/${ProjectName}/scylladb/realm0-endpoint" \
                  --value "$INSTANCE_IP:9042" \
                  --type String \
                  --overwrite \
                  --region ${AWS::Region}
                ;;
              30)
                # Realm16384 subnet
                aws ssm put-parameter \
                  --name "/${ProjectName}/scylladb/realm16384-endpoint" \
                  --value "$INSTANCE_IP:9042" \
                  --type String \
                  --overwrite \
                  --region ${AWS::Region}
                ;;
            esac
            
            # On the first node, create keyspaces for QED
            if [ "$SEEDS" == "$INSTANCE_IP" ]; then
              echo "First node, creating QED keyspaces..."
              sleep 30  # Give time for cluster to stabilize
              
              # Create keyspaces with replication factor 3
              cqlsh $INSTANCE_IP 9042 << 'CQLEOF'
              CREATE KEYSPACE IF NOT EXISTS qed_coordinator
                WITH REPLICATION = {
                  'class': 'NetworkTopologyStrategy',
                  'datacenter1': 3
                }
                AND durable_writes = true;
              
              CREATE KEYSPACE IF NOT EXISTS qed_realm_0
                WITH REPLICATION = {
                  'class': 'NetworkTopologyStrategy',
                  'datacenter1': 3
                }
                AND durable_writes = true;
              
              CREATE KEYSPACE IF NOT EXISTS qed_realm_16384
                WITH REPLICATION = {
                  'class': 'NetworkTopologyStrategy',
                  'datacenter1': 3
                }
                AND durable_writes = true;
            CQLEOF
              
              # Store cluster contact point
              aws ssm put-parameter \
                --name "/${ProjectName}/scylladb/cluster-contact-point" \
                --value "$INSTANCE_IP:9042" \
                --type String \
                --overwrite \
                --region ${AWS::Region}
            fi
            
            echo "ScyllaDB setup completed successfully at $(date)"

  # EBS Volumes for Multi-Attach
  CoordinatorEBSVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Size: 500
      VolumeType: io2
      Iops: 16000
      MultiAttachEnabled: true
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-coordinator-ebs
        - Key: Project
          Value: !Ref ProjectName

  Realm0EBSVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Select [1, !GetAZs '']
      Size: 500
      VolumeType: io2
      Iops: 16000
      MultiAttachEnabled: true
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-realm0-ebs
        - Key: Project
          Value: !Ref ProjectName

  Realm16384EBSVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Select [2, !GetAZs '']
      Size: 500
      VolumeType: io2
      Iops: 16000
      MultiAttachEnabled: true
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-realm16384-ebs
        - Key: Project
          Value: !Ref ProjectName

  # ScyllaDB Auto Scaling Group
  ScyllaDBAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub ${ProjectName}-scylladb-asg
      LaunchTemplate:
        LaunchTemplateId: !Ref ScyllaDBLaunchTemplate
        Version: !GetAtt ScyllaDBLaunchTemplate.LatestVersionNumber
      MinSize: !Ref ScyllaDBInstanceCount
      MaxSize: !Ref ScyllaDBInstanceCount
      DesiredCapacity: !Ref ScyllaDBInstanceCount
      VPCZoneIdentifier:
        - !Ref CoordinatorSubnet
        - !Ref Realm0Subnet
        - !Ref Realm16384Subnet
      HealthCheckType: EC2
      HealthCheckGracePeriod: 600
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-scylladb-node
          PropagateAtLaunch: true
        - Key: Project
          Value: !Ref ProjectName
          PropagateAtLaunch: true
        - Key: Component
          Value: scylladb
          PropagateAtLaunch: true

  # ECR Repository (managed externally)

  # Redis on EC2 - Independent instances for each Realm
  # Redis Launch Template for Auto Scaling Group
  RedisLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${ProjectName}-redis-lt
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: r6i.2xlarge
        KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref AWS::NoValue]
        IamInstanceProfile:
          Name: !Ref WorkerInstanceProfile
        SecurityGroupIds:
          - !Ref CoordinatorRedisSecurityGroup
          - !Ref Realm0RedisSecurityGroup
          - !Ref Realm16384RedisSecurityGroup
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Project
                Value: !Ref ProjectName
              - Key: Component
                Value: redis
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e
            exec > /var/log/user-data.log 2>&1
            echo "Starting Multi-Redis setup at $(date)..."
            
            # Update system
            apt-get update -y || { echo "apt-get update failed"; exit 1; }
            apt-get install -y docker.io awscli || { echo "Package install failed"; exit 1; }
            systemctl enable docker
            systemctl start docker
            
            # Wait for Docker to be ready
            sleep 10
            
            # Get instance IP
            INSTANCE_IP=$(curl -s http://169.254.169.254/latest/meta-data/local-ipv4)
            echo "Instance IP: $INSTANCE_IP"
            
            # Create data directories for 3 Redis instances
            mkdir -p /data/redis-coordinator /data/redis-realm0 /data/redis-realm16384
            
            # Run Coordinator Redis (port 6379)
            echo "Starting Coordinator Redis container..."
            docker run -d \
              --name redis-coordinator \
              -p 6379:6379 \
              -v /data/redis-coordinator:/data \
              --restart always \
              --memory=20g \
              redis:7-alpine \
              redis-server \
                --appendonly yes \
                --dir /data \
                --maxmemory 18gb \
                --maxmemory-policy allkeys-lru \
                --port 6379 || { echo "Coordinator Redis failed"; exit 1; }
            
            # Run Realm0 Redis (port 6380)
            echo "Starting Realm0 Redis container..."
            docker run -d \
              --name redis-realm0 \
              -p 6380:6379 \
              -v /data/redis-realm0:/data \
              --restart always \
              --memory=20g \
              redis:7-alpine \
              redis-server \
                --appendonly yes \
                --dir /data \
                --maxmemory 18gb \
                --maxmemory-policy allkeys-lru \
                --port 6379 || { echo "Realm0 Redis failed"; exit 1; }
            
            # Run Realm16384 Redis (port 6381)
            echo "Starting Realm16384 Redis container..."
            docker run -d \
              --name redis-realm16384 \
              -p 6381:6379 \
              -v /data/redis-realm16384:/data \
              --restart always \
              --memory=20g \
              redis:7-alpine \
              redis-server \
                --appendonly yes \
                --dir /data \
                --maxmemory 18gb \
                --maxmemory-policy allkeys-lru \
                --port 6379 || { echo "Realm16384 Redis failed"; exit 1; }
            
            # Wait for containers to be ready
            sleep 15
            echo "All Redis containers started successfully"
            
            # Store endpoints in SSM Parameter Store
            echo "Storing SSM parameters..."
            aws ssm put-parameter \
              --name "/${ProjectName}/redis/coordinator/endpoint" \
              --value "$INSTANCE_IP:6379" \
              --type String \
              --overwrite \
              --region ${AWS::Region} || echo "Coordinator SSM parameter failed"
            
            aws ssm put-parameter \
              --name "/${ProjectName}/redis/realm0/endpoint" \
              --value "$INSTANCE_IP:6380" \
              --type String \
              --overwrite \
              --region ${AWS::Region} || echo "Realm0 SSM parameter failed"
            
            aws ssm put-parameter \
              --name "/${ProjectName}/redis/realm16384/endpoint" \
              --value "$INSTANCE_IP:6381" \
              --type String \
              --overwrite \
              --region ${AWS::Region} || echo "Realm16384 SSM parameter failed"
            
            echo "Multi-Redis setup completed successfully at $(date)"

