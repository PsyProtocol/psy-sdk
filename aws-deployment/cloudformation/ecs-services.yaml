  # CloudWatch Alarms for monitoring
  CoordinatorEdgeHighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-coordinator-edge-high-cpu
      AlarmDescription: Triggers when coordinator edge service CPU is too high
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value: !Sub ${ProjectName}-coordinator-edge
        - Name: ClusterName
          Value: !Sub ${ProjectName}-cluster

