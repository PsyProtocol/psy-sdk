[package]
edition = "2021"
name    = "qed_node_experiments"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow     = { workspace = true }
bincode      = { workspace = true }
serde      = { workspace = true }
serde_json      = { workspace = true }
serde_repr      = { workspace = true }
serde_with = { workspace = true }
hex = { workspace = true }
hex-literal = { workspace = true }
lazy_static = { workspace = true }
plonky2 = { workspace = true }
twox-hash = { workspace = true }
tracing = { workspace = true }

kvq = { path = "../kvq" }
qed_core = { path = "../qed_core" }
qed_common_circuit = { path = "../qed_common_circuit" }
qed_rollup_circuit = { path = "../qed_rollup_circuit" }
qed_data = { path = "../qed_data" }
qed_crypto = { path = "../qed_crypto" }
qed_store = { path = "../qed_store" }
qed_node_common = { path = "../qed_node_common" }

rand = { workspace = true }
log = { workspace = true }

tokio = { version = "1.43.0", features = ["full"] }
scylla = "0.15.1"
chrono = { workspace = true }

lapin = "=2.5.0"
temporal-client = { git = "https://github.com/cf/sdk-core", version = "0.1.0-alpha.1", branch = "rust-sdk" }
temporal-sdk = { git = "https://github.com/cf/sdk-core", version = "0.1.0-alpha.1", branch = "rust-sdk" }
temporal-sdk-core = { git = "https://github.com/cf/sdk-core", version = "0.1.0-alpha.1", branch = "rust-sdk" }
temporal-sdk-core-api = { git = "https://github.com/cf/sdk-core", version = "0.1.0-alpha.1", branch = "rust-sdk" }
temporal-sdk-core-protos = { git = "https://github.com/cf/sdk-core", version = "0.1.0-alpha.1", branch = "rust-sdk" }
prost-wkt-types = "0.6.0"

futures = "0.3.0"
amqprs = "=2.1.0"
tokio-executor-trait = "2.1.3"
redis = { version = "^0.25", default-features = false, features = ["acl", "keep-alive", "script"] }
rsmq = { git = "https://github.com/GopherJ/rsmq-async-rs", rev = "2af5a5c06a0341cb60f73ba0f0af066f65fb5e77", default-features = false }
r2d2 = { git = "https://github.com/GopherJ/r2d2", rev = "976ca74a74871d78764da2a040edcadad1af9be9" }
r2d2_redis = { git = "https://github.com/GopherJ/r2d2-redis", rev = "63be37454cf441b832251aa915b1a9cb8bc27bff" }
broccoli_queue = { version = "0.3.3", features = ["redis"] }
rabbitmq-stream-client = "0.8.0"
tokio-reactor-trait = "1.1.0"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }
