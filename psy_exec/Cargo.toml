[package]
edition = "2021"
name    = "psy_exec"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json      = { workspace = true }
plonky2 = { workspace = true }
bincode = { workspace = true }
ts-rs = { workspace = true }

kvq = { workspace = true }
psy_core = { workspace = true }
psy_vm = { workspace = true }
psy_data = { workspace = true, default-features = false }
psy_crypto = { workspace = true }
async-trait = { workspace = true }
maybe-async = {workspace = true}
tracing = { workspace = true }
psy_store = { workspace = true, default-features = false }
qedlang_macros = { workspace = true }

[features]
# default = ["is_sync"]
is_sync = [
    "maybe-async/is_sync",
    "psy_data/is_sync",
    "psy_store/is_sync"]

[dev-dependencies]
tokio = { workspace = true }
