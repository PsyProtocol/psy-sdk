[workspace]
members = ["psy-rust-sdk"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.86"
version = "0.1.0"
homepage = "https://psy.xyz"
repository = "https://github.com/PsyProtocol/psy-sdk"

[workspace.lints]

[workspace.dependencies]
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.40"

plonky2 = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934", features = [
  "ts-rs",
] }
plonky2_maybe_rayon = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934" }

psy_vm = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b", package = "psy_vm", default-features = false }
psy_crypto = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b", package = "psy_crypto" }
psy_data = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b", package = "psy_client_data", default-features = false }
psy_common = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b", package = "psy_client_common" }
psy_config = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b", package = "psy_config" }
psy_prover = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b", package = "psy_prover", default-features = false }
psy_provider = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b", package = "psy_provider" }
psy_common_circuit = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b", package = "psy_common_circuit", default-features = false }
psy_dpn_circuit = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b", package = "psy_dpn_circuit", default-features = false }
psy_ups_circuit = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b", package = "psy_ups_circuit" }

base64 = "0.22"
bincode = { version = "=1.3.3" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wasm-logger = "0.2"
wasm-tracing = "2.0"
web-sys = "0.3"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
cfg-if = "1.0"

getrandom = { version = "0.3" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
] }

[profile.release]
debug = false

# Pin the psy-node proving backend across the whole dependency graph.
[patch."https://github.com/PsyProtocol/plonky2-hwa"]
plonky2 = { git = "https://www.github.com/PsyProtocol/plonky2-hwa", rev = "736572e9dd3ca93566471cf5a2a1cb67a13fe01d" }
plonky2_field = { git = "https://www.github.com/PsyProtocol/plonky2-hwa", rev = "736572e9dd3ca93566471cf5a2a1cb67a13fe01d" }
plonky2_maybe_rayon = { git = "https://www.github.com/PsyProtocol/plonky2-hwa", rev = "736572e9dd3ca93566471cf5a2a1cb67a13fe01d" }
plonky2_util = { git = "https://www.github.com/PsyProtocol/plonky2-hwa", rev = "736572e9dd3ca93566471cf5a2a1cb67a13fe01d" }

# Unify the psy-node dependency graph on one pinned node revision.
[patch."https://github.com/PsyProtocol/psy-node.git"]
psy_vm = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b" }
psy_crypto = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b" }
psy_client_data = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b" }
psy_client_common = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b" }
psy_config = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b" }
psy_common_circuit = { git = "https://www.github.com/PsyProtocol/psy-node.git", rev = "24a28a200b64b71be11715ea8b3365c1ecc73b1b" }
