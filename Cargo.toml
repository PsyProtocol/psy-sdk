[workspace]
members = [
    "qed-abi",
    "qed-cirgen",
    "qed-fmt",
    "qed-cli",
    "qed-ir",
    "qed-lsp-server",
    "qed-parser",
    "qed-utils",
    "qed-vm"
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.75"
once_cell = "1.19.0"

num-traits = "0.2.18"
num-bigint = { version = "0.4.6" }
num = { version = "0.4.0", default-features = false }
num-integer = { version = "0.1", default-features = false }
ruint = { version = "1.12", default-features = false, features = ["serde", "num-bigint"] }
clap = { version = "4.4.6", features = ["derive", "env"] }

rayon = { version = "1.10" }

bincode = "1.3.3"
strum = { version = "0.26.3", features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.114",  default-features = false, features = ["arbitrary_precision", "alloc"] }
serde_with = { version = "3.8.3",  default-features = false, features = ["macros", "hex"] }
serde_repr = "0.1.19"

plonky2 = { git = "https://github.com/QEDProtocol/plonky2-hwa", rev = "6a8ca008da97890b67a84f64784cfbc488b5238d" }
plonky2_maybe_rayon = { git = "https://github.com/QEDProtocol/plonky2-hwa", rev = "6a8ca008da97890b67a84f64784cfbc488b5238d", default-features = false }

tracing = "0.1.40"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["std", "env-filter"] }

sha3 = { version = "0.10.8",  default-features = false }
blake2 = { version = "0.10.6",  default-features = false }
blake3 = { version = "1.5", default-features = false }
tiny-keccak = { version = "2.0", features = ["sha3", "keccak"] }
