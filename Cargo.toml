[workspace]
members = [
    "qedlang_core",
    "qedlang_ex",
    "qedlang_macros",
    "qedlang_macro2",
    "qedlang_macro3",
    "kvq",
    "kvq_store_lmdbx",
    "qed_core",
    "qed_crypto",
    "qed_store",
    "qed_prover",
    "qed_exec",
    "qed_data",
    "qed_common_circuit",
    "qed_rollup_circuit",
    "qcircuit_config_db",
    "qcircuit_config_db_generator",
    "qed_node_common",
    "qed_node",
    "qed_realm_node",
    "qed_coordinator_node",
    "qed_user_cli",
    "qed_rollup_cli",
    "qed_rollup_utils",
    "qed_worker",
    "qed_scylla_store",
    "qed_test_sandbox",
    "qed_compiler/qed-fmt",
    "qed_compiler/qed-cli",
    "qed_compiler/qed-lsp-server",
    "qed_compiler/qed-parser",
    "qed_compiler/qed-utils",
    "qed_compiler/qed-common",
    "qed_compiler/qed-ast",
    "qed_compiler/qed-derive",
    "qed_compiler/qed-sema",
    "qed_compiler/qed-lexer",
    "qed_compiler/qed-interpreter",
    "qed_compiler/qed-dargo",
    "qed_compiler/qed-dargo-toml",
    "qed_compiler/qed-dargo-cli",
    "qed_common",
    "qed_user_cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.86"
version = "0.1.0"
homepage = "https://qedprotocol.com"
repository = "https://github.com/QEDProtocol/qedlang-rustk"

[workspace.lints]

[workspace.dependencies]
colored = "2"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.4.0", features = ["hex"] }
serde_repr = "0.1.19"
hex = "0.4.3"
hex-literal = "0.4.1"
lazy_static = "1.4.0"
once_cell = "1.19.0"
twox-hash = "1.6.3"
hashbrown = "0.14.5"
anyhow = "1.0.75"
async-trait = { version = "0.1.88" }
base64 = "0.22"
bitcoin = { version = "0.31.1", features = ["serde", "rand"] }
chrono = "0.4.39"


rand = "0.8.5"
rand_core = "0.9"
rand_pcg = "0.9"
rayon = { version = "1.10.0" }
bincode = "=1.3.3"
serde_cbor = { version = "0.11.2" }

tracing = "0.1.40"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.17", features = [
    "std",
    "env-filter",
    "json",
    "chrono",
] }
itertools = "0.14"

bytes = "1"
byteorder = "1.5"
derive_more = { version = "2", default-features = false, features = ["full"] }
indexmap = "2.9"
parking_lot = "0.12"
smallvec = "1.15"
thiserror = "2.0"
dashmap = "6.1"
cc = "1.2"
bindgen = "0.71"

clap = { version = "4.4.6", features = ["derive", "env"] }
k256 = { version = "0.13.2", features = [
  "arithmetic",
  "ecdsa",
  "pkcs8",
  "precomputed-tables",
  "schnorr",
  "signature",
  "std",
  "serde",
] }

sha2 = "0.10.8"
sha3 = "0.10.8"

repl-rs = "0.2.8"

num = { version = "0.4.0", default-features = false }
unroll = "0.1.5"
postcard = { version = "1.0.0", default-features = false, features = ["alloc"] }

bitflags = "2.5.0"

ripemd = "0.1.3"
log = { version = "0.4.14", default-features = false }
env_logger = { version = "0.11", default-features = false }
dotenvy = "0.15.0"

tokio = { version = "1.43.0", features = ["full"] }
tokio-executor-trait = "2.1.3"
tokio-reactor-trait = "2"

futures = "0.3.0"
redis = { version = "^0.25", default-features = false, features = [
  "acl",
  "keep-alive",
  "script",
] }
fred = "10.0.4"

reth-mdbx-sys = { path = "./kvq_store_lmdbx/libmdbx-rs/mdbx-sys" }
reth-libmdbx = { path = "./kvq_store_lmdbx/libmdbx-rs" }
criterion = "0.5"
pprof = "0.14"
tempfile = "3.19"
kvq_store_lmdbx = { path = "./kvq_store_lmdbx" }

miette = { version = "7.2", features = ["fancy"] }
dotenv = "0.15"

smol_str = "0.3"
thin-vec = "0.2"
id-arena = "2.2"
unescaper = "0.1"
derivative = "2.2"

petgraph = "0.7"
rangemap = "1.4"
chalk = "0.1"
ena = "0.14"
unicode-segmentation = "1.12"

syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"
quote = "1.0"

num-traits = "0.2"
num-bigint = { version = "0.4" }
num-integer = { version = "0.1", default-features = false }
ruint = { version = "1.12", default-features = false, features = [
  "serde",
  "num-bigint",
] }
clap_complete = "4.5"
color-eyre = "0.6"


enum-as-inner = "0.6"
strum = { version = "0.27", features = ["derive"] }

plonky2 = { git = "https://github.com/QEDProtocol/plonky2-hwa", rev = "5e8d6a22cdc12e6e1e4928da1f877fc659d0304c" }
plonky2_maybe_rayon = { git = "https://github.com/QEDProtocol/plonky2-hwa", rev = "5e8d6a22cdc12e6e1e4928da1f877fc659d0304c", default-features = false }

tracing-appender = "0.2"

blake2 = { version = "0.10", default-features = false }
blake3 = { version = "1.5", default-features = false }
tiny-keccak = { version = "2.0", features = ["sha3", "keccak"] }

lalrpop-util = { version = "0.22", features = ["lexer", "unicode"] }
lalrpop = "0.22"

walkdir = "2.5"
insta = { version = "1.40", features = ["glob"] }
home = { version = "0.5" }

tower-lsp = "0.20"
lsp-server = "0.7"
lsp-types = "0.97"

nom = "8.0"
logos = "0.15"
ariadne = { version = "0.5.0", features = ["auto-color"] }

either = "1"
llvm-sys = "191.0"
melior = { version = "0.21", features = ["ods-dialects"] }
mlir-sys = { version = "0.4" }

envy = "0.4"
regex = "1.11"
toml = "0.8"
url = "2.5"
dirs = "6.0"
semver = "1.0"
md5 = "0.7"
jsonrpsee = { version = "0.25", features = ["server", "client", "macros"] }
config = "0.15"

qedlang_core = { path = "./qedlang_core" }
qed_crypto = { path = "./qed_crypto" }
qed_exec = { path = "./qed_exec" }
qed_store = { path = "./qed_store" }
qed_data = { path = "./qed_data" }
qed_core = { path = "./qed_core" }
qed_node = { path = "./qed_node" }
qed_prover = { path = "./qed_prover" }
qed_common = { path = "./qed_common" }
qed_common_circuit = { path = "./qed_common_circuit" }
kvq = { path = "./kvq" }
qed_node_common = { path = "./qed_node_common" }
qed_rollup_circuit = { path = "./qed_rollup_circuit" }
qed_rollup_utils= { path = "./qed_rollup_utils" }
qed_coordinator_node = { path = "./qed_coordinator_node" }
qed_realm_node = { path = "./qed_realm_node" }
qed_worker = { path = "./qed_worker" }

qed-ast = { path = "./qed_compiler/qed-ast" }
qed-cli = { path = "./qed_compiler/qed-cli" }
qed-derive = { path = "./qed_compiler/qed-derive" }
qed-fmt = { path = "./qed_compiler/qed-fmt" }
qed-lsp-server = { path = "./qed_compiler/qed-lsp-server" }
qed-parser = { path = "./qed_compiler/qed-parser" }
qed-utils = { path = "./qed_compiler/qed-utils" }
qed-common = { path = "./qed_compiler/qed-common" }
qed-sema = { path = "./qed_compiler/qed-sema" }
qed-lexer = { path = "./qed_compiler/qed-lexer" }
qed-interpreter = { path = "./qed_compiler/qed-interpreter" }
qed-dargo = { path = "./qed_compiler/qed-dargo" }
qed-dargo-toml = { path = "./qed_compiler/qed-dargo-toml" }
dargo = { path = "./qed_compiler/qed-dargo-cli" }

serial_test = "3.2"

shadow-rs = "0.27.1"
bs58 = { version = "0.5.1", features = ["std", "check"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.11.22", default-features = false, features = [
  "json",
  "rustls",
  "blocking",
] }

jsonwebtoken = "9.3.1"
futures-util = "0.3.28"
axum = "0.8.3"