# qed_crypto = { path = "../qedlang-rust/qed_crypto" }
# qed_exec = { path = "../qedlang-rust/qed_exec" }
# qed_store = { path = "../qedlang-rust/qed_store" }
# qed_data = { path = "../qedlang-rust/qed_data" }
# qed_core = { path = "../qedlang-rust/qed_core" }
# qed_prover = { path = "../qedlang-rust/qed_prover" }
# qed_common_circuit = { path = "../qedlang-rust/qed_common_circuit" }
# kvq = { path = "../qedlang-rust/kvq" }

qed-abi = { path = "./qed-abi" }
qed-ast = { path = "./qed-ast" }
qed-cli = { path = "./qed-cli" }
qed-codegen = { path = "./qed-codegen" }
qed-derive = { path = "./qed-derive" }
qed-fmt = { path = "./qed-fmt" }
qed-ir = { path = "./qed-ir" }
qed-lsp-server = { path = "./qed-lsp-server" }
qed-parser = { path = "./qed-parser" }
qed-utils = { path = "./qed-utils" }
qed-common = { path = "./qed-common" }
qed-vm = { path = "./qed-vm" }
qed-irgen = { path = "./qed-irgen" }
qed-opt = { path = "./qed-opt" }
qed-sema = { path = "./qed-sema" }
qed-repl = { path = "./qed-repl" }
qed-lexer = { path = "./qed-lexer" }
qed-interpreter = { path = "./qed-interpreter" }
qed-store = { path = "./qed-store" }
