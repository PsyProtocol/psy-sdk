[workspace]
members = ["psy-rust-sdk"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.86"
version = "0.1.0"
homepage = "https://psy.xyz"
repository = "https://github.com/PsyProtocol/psy-sdk"

[workspace.lints]

[workspace.dependencies]
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.40"

plonky2 = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934", features = [
  "ts-rs",
] }
plonky2_maybe_rayon = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934" }

psy_vm = { path = "../parth-generic-v1/client_prover/psy_vm", package = "psy_vm", default-features = false }
psy_crypto = { path = "../parth-generic-v1/client_prover/psy_core/psy_crypto", package = "psy_crypto" }
psy_data = { path = "../parth-generic-v1/client_prover/psy_core/psy_data", package = "psy_client_data", default-features = false }
psy_common = { path = "../parth-generic-v1/client_prover/psy_core/psy_common", package = "psy_client_common" }
psy_config = { path = "../parth-generic-v1/client_prover/psy_core/psy_config", package = "psy_config" }
psy_prover = { path = "../parth-generic-v1/client_prover/psy_prover", package = "psy_prover", default-features = false }
psy_provider = { path = "../parth-generic-v1/client_prover/psy_provider", package = "psy_provider" }
psy_common_circuit = { path = "../parth-generic-v1/client_prover/psy_circuit/psy_common_circuit", package = "psy_common_circuit", default-features = false }
psy_dpn_circuit = { path = "../parth-generic-v1/client_prover/psy_circuit/psy_dpn_circuit", package = "psy_dpn_circuit", default-features = false }
psy_ups_circuit = { path = "../parth-generic-v1/client_prover/psy_circuit/psy_ups_circuit", package = "psy_ups_circuit", default-features = false }

base64 = "0.22"
bincode = { version = "=1.3.3" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wasm-logger = "0.2"
wasm-tracing = "2.0"
web-sys = "0.3"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
cfg-if = "1.0"

getrandom = { version = "0.3" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
] }

[profile.release]
debug = false
