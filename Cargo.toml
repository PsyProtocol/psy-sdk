[workspace]
members = ["psy-rust-sdk"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.86"
version = "0.1.0"
homepage = "https://psy.xyz"
repository = "https://github.com/PsyProtocol/psy-sdk"

[workspace.lints]

[workspace.dependencies]
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.40"

plonky2 = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934", features = [
  "ts-rs",
] }
plonky2_maybe_rayon = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934" }

psy_vm = { git = "https://github.com/QEDProtocol/qedlang-rust", rev = "3ae6453c5269029bf2b6b36442ee1531a7e7d209", default-features = false }
psy_crypto = { git = "https://github.com/QEDProtocol/qedlang-rust", rev = "3ae6453c5269029bf2b6b36442ee1531a7e7d209" }
psy_data = { git = "https://github.com/QEDProtocol/qedlang-rust", rev = "3ae6453c5269029bf2b6b36442ee1531a7e7d209", default-features = false }
psy_common = { git = "https://github.com/QEDProtocol/qedlang-rust", rev = "3ae6453c5269029bf2b6b36442ee1531a7e7d209" }
psy_config = { git = "https://github.com/QEDProtocol/qedlang-rust", rev = "3ae6453c5269029bf2b6b36442ee1531a7e7d209" }
psy_prover = { git = "https://github.com/QEDProtocol/qedlang-rust", rev = "3ae6453c5269029bf2b6b36442ee1531a7e7d209", default-features = false }
psy_provider = { git = "https://github.com/QEDProtocol/qedlang-rust", rev = "3ae6453c5269029bf2b6b36442ee1531a7e7d209" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wasm-logger = "0.2"
wasm-tracing = "2.0"
web-sys = "0.3"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
cfg-if = "1.0"

getrandom = { version = "0.3" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "blocking",
] }

[profile.release]
debug = false
