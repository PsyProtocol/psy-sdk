[workspace]
members = [
  "qedlang_core",
  "qedlang_ex",
  "qedlang_macros",
  "qedlang_macro2",
  "qedlang_macro3",
  "kvq",
  "qed_core",
  "qed_crypto",
  "qed_store",
  "qed_prover",
  "qed_exec",
  "qed_data",
  "qed_common_circuit",
  "qed_rollup_circuit",
  "qcircuit_config_db",
  "qcircuit_config_db_generator",
  "qed_node_common",
  "qed_node",
  "qed_scylla_store",
  "qed_test_sandbox",
]
resolver = "2"

[workspace.dependencies]
colored = "2"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.4.0", features = ["hex"] }
serde_repr = "0.1.19"
hex = "0.4.3"
hex-literal = "0.4.1"
lazy_static = "1.4.0"
once_cell = "1.19.0"
twox-hash = "1.6.3"
hashbrown = "0.14.5"
plonky2 = { git = "https://github.com/QEDProtocol/plonky2-hwa", rev = "5e8d6a22cdc12e6e1e4928da1f877fc659d0304c" }
plonky2_maybe_rayon = { git = "https://github.com/QEDProtocol/plonky2-hwa", rev = "5e8d6a22cdc12e6e1e4928da1f877fc659d0304c", default-features = false }
anyhow = "1.0.75"
async-trait = { version = "0.1.80" }
base64 = "0.21.0"
bitcoin = { version = "0.31.1", features = ["serde", "rand"] }
chrono = "0.4.39"


rand = "0.8"
rand_core = "0.6.0"
rand_pcg = "0.9.0"
rayon = { version = "1.10.0" }
bincode = "=1.3.3"

tracing = "0.1.40"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.17", features = ["std", "env-filter"] }
itertools = "0.10.5"


bytes = "1"

clap = { version = "4.4.6", features = ["derive", "env"] }
k256 = { version = "0.13.2", features = [
  "arithmetic",
  "ecdsa",
  "pkcs8",
  "precomputed-tables",
  "schnorr",
  "signature",
  "std",
  "serde",
] }

sha2 = "0.10.8"
sha3 = "0.10.8"


num = { version = "0.4.0", default-features = false }
unroll = "0.1.5"
postcard = { version = "1.0.0", default-features = false, features = ["alloc"] }

bitflags = "2.5.0"

ripemd = "0.1.3"
log = { version = "0.4.14", default-features = false }
env_logger = { version = "0.9.0", default-features = false }


tokio = { version = "1.43.0", features = ["full"] }
tokio-executor-trait = "2.1.3"
tokio-reactor-trait = "1.1.0"

futures = "0.3.0"
redis = { version = "^0.25", default-features = false, features = ["acl", "keep-alive", "script"] }
fred = "10.0.4"


[patch.'https://github.com/0xPolygonZero/plonky2.git']
plonky2 = { git = "https://github.com/QEDProtocol/plonky2-hwa", rev = "5e8d6a22cdc12e6e1e4928da1f877fc659d0304c" }
