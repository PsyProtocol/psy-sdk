[workspace]
members = ["psy-rust-sdk"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.86"
version = "0.1.0"
homepage = "https://psy.xyz"
repository = "https://github.com/PsyProtocol/psy-sdk"

[workspace.lints]

[workspace.dependencies]
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.40"

plonky2 = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934", features = [
  "ts-rs",
] }
plonky2_maybe_rayon = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934" }

psy_vm = { git = "https://github.com/PsyProtocol/psy-node", rev = "6f07c8ef2f7561c6fba00869e004da5a247a6f48", package = "psy_vm", default-features = false }
psy_crypto = { git = "https://github.com/PsyProtocol/psy-node", rev = "6f07c8ef2f7561c6fba00869e004da5a247a6f48", package = "psy_crypto" }
psy_data = { git = "https://github.com/PsyProtocol/psy-node", rev = "6f07c8ef2f7561c6fba00869e004da5a247a6f48", package = "psy_client_data", default-features = false }
psy_common = { git = "https://github.com/PsyProtocol/psy-node", rev = "6f07c8ef2f7561c6fba00869e004da5a247a6f48", package = "psy_client_common" }
psy_config = { git = "https://github.com/PsyProtocol/psy-node", rev = "6f07c8ef2f7561c6fba00869e004da5a247a6f48", package = "psy_config" }
psy_prover = { git = "https://github.com/PsyProtocol/psy-node", rev = "6f07c8ef2f7561c6fba00869e004da5a247a6f48", package = "psy_prover", default-features = false }
psy_provider = { git = "https://github.com/PsyProtocol/psy-node", rev = "6f07c8ef2f7561c6fba00869e004da5a247a6f48", package = "psy_provider" }
psy_common_circuit = { git = "https://github.com/PsyProtocol/psy-node", rev = "6f07c8ef2f7561c6fba00869e004da5a247a6f48", package = "psy_common_circuit", default-features = false }
psy_dpn_circuit = { git = "https://github.com/PsyProtocol/psy-node", rev = "6f07c8ef2f7561c6fba00869e004da5a247a6f48", package = "psy_dpn_circuit", default-features = false }
psy_ups_circuit = { git = "https://github.com/PsyProtocol/psy-node", rev = "6f07c8ef2f7561c6fba00869e004da5a247a6f48", package = "psy_ups_circuit" }

base64 = "0.22"
bincode = { version = "=1.3.3" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wasm-logger = "0.2"
wasm-tracing = "2.0"
web-sys = "0.3"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
cfg-if = "1.0"

getrandom = { version = "0.3" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
] }

[profile.release]
debug = false

# Lab (wallet-local-prove-lab-20261123): build against the local worktrees.
[patch."https://github.com/PsyProtocol/psy-node"]
psy_vm = { path = "../psy-node/client_prover/psy_vm" }
psy_crypto = { path = "../psy-node/client_prover/psy_core/psy_crypto" }
psy_client_data = { path = "../psy-node/client_prover/psy_core/psy_data" }
psy_client_common = { path = "../psy-node/client_prover/psy_core/psy_common" }
psy_config = { path = "../psy-node/client_prover/psy_core/psy_config" }
psy_prover = { path = "../psy-node/client_prover/psy_prover" }
psy_provider = { path = "../psy-node/client_prover/psy_provider" }
psy_common_circuit = { path = "../psy-node/client_prover/psy_circuit/psy_common_circuit" }
psy_dpn_circuit = { path = "../psy-node/client_prover/psy_circuit/psy_dpn_circuit" }
psy_ups_circuit = { path = "../psy-node/client_prover/psy_circuit/psy_ups_circuit" }

[patch."https://github.com/PsyProtocol/plonky2-hwa"]
plonky2 = { path = "../plonky2-hwa/plonky2" }
plonky2_maybe_rayon = { path = "../plonky2-hwa/maybe_rayon" }
plonky2_field = { path = "../plonky2-hwa/field" }
plonky2_util = { path = "../plonky2-hwa/util" }
