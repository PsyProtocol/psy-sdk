[workspace]
members = ["psy-rust-sdk"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.86"
version = "0.1.0"
homepage = "https://psy.xyz"
repository = "https://github.com/PsyProtocol/psy-sdk"

[workspace.lints]

[workspace.dependencies]
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.40"

plonky2 = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934", features = [
  "ts-rs",
] }
plonky2_maybe_rayon = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934" }

psy_vm = { git = "ssh://git@github.com/QEDProtocol/parth-generic-v1.git", rev = "5a6c0025ad341da6bc76584c128c8cb8608192f9", package = "psy_vm", default-features = false }
psy_crypto = { git = "ssh://git@github.com/QEDProtocol/parth-generic-v1.git", rev = "5a6c0025ad341da6bc76584c128c8cb8608192f9", package = "psy_crypto" }
psy_data = { git = "ssh://git@github.com/QEDProtocol/parth-generic-v1.git", rev = "5a6c0025ad341da6bc76584c128c8cb8608192f9", package = "psy_client_data", default-features = false }
psy_common = { git = "ssh://git@github.com/QEDProtocol/parth-generic-v1.git", rev = "5a6c0025ad341da6bc76584c128c8cb8608192f9", package = "psy_client_common" }
psy_config = { git = "ssh://git@github.com/QEDProtocol/parth-generic-v1.git", rev = "5a6c0025ad341da6bc76584c128c8cb8608192f9", package = "psy_config" }
psy_prover = { git = "ssh://git@github.com/QEDProtocol/parth-generic-v1.git", rev = "5a6c0025ad341da6bc76584c128c8cb8608192f9", package = "psy_prover", default-features = false }
psy_provider = { git = "ssh://git@github.com/QEDProtocol/parth-generic-v1.git", rev = "5a6c0025ad341da6bc76584c128c8cb8608192f9", package = "psy_provider" }
psy_common_circuit = { git = "ssh://git@github.com/QEDProtocol/parth-generic-v1.git", rev = "5a6c0025ad341da6bc76584c128c8cb8608192f9", package = "psy_common_circuit", default-features = false }
psy_dpn_circuit = { git = "ssh://git@github.com/QEDProtocol/parth-generic-v1.git", rev = "5a6c0025ad341da6bc76584c128c8cb8608192f9", package = "psy_dpn_circuit", default-features = false }

base64 = "0.22"
bincode = { version = "=1.3.3" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wasm-logger = "0.2"
wasm-tracing = "2.0"
web-sys = "0.3"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
cfg-if = "1.0"

getrandom = { version = "0.3" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
] }

[profile.release]
debug = false

[patch."ssh://git@github.com/QEDProtocol/parth-generic-v1.git"]
gnark-plonky2-wrapper = { git = "ssh://git@github.com/QEDProtocol/gnark-plonky2-verifier.git", package = "gnark-plonky2-wrapper", rev = "35fd12a8117e53939703df6d7b98567933e65159" }
gnark-plonky2-verifier-ffi = { git = "ssh://git@github.com/QEDProtocol/gnark-plonky2-verifier.git", package = "gnark-plonky2-verifier-ffi", rev = "35fd12a8117e53939703df6d7b98567933e65159" }
