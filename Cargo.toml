[workspace]
members = [
  "qedlang_core",
  "qedlang_ex",
  "qedlang_macros",
  "qedlang_macro2",
  "qedlang_macro3",
  "kvq",
  "qed_core",
  "qed_crypto",
  "qed_store",
  "qed_data"
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.4.0", features = ["hex"] }
serde_repr = "0.1.19"
hex = "0.4.3"
hex-literal = "0.4.1"
lazy_static = "1.4.0"
once_cell = "1.19.0"
twox-hash = "1.6.3"
hashbrown = "0.14.5"
plonky2 = { git = "https://github.com/QEDProtocol/plonky2-hwa", rev = "6a8ca008da97890b67a84f64784cfbc488b5238d" }
plonky2_maybe_rayon = { git = "https://github.com/QEDProtocol/plonky2-hwa", rev = "6a8ca008da97890b67a84f64784cfbc488b5238d", default-features = false }
anyhow = "1.0.75"
rand = "0.8"
rand_core = "0.6.0"
rayon = { version = "1.10.0" }
bincode = "=1.3.3"

tracing = "0.1.40"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.17", features = ["std", "env-filter"] }
itertools = "0.10.5"


[patch.'https://github.com/0xPolygonZero/plonky2.git']
plonky2 = { git = "https://github.com/QEDProtocol/plonky2-hwa", rev = "6a8ca008da97890b67a84f64784cfbc488b5238d" }
