[workspace]
members = [
    "qed-abi",
    "qed-fmt",
    "qed-cli",
    "qed-ir",
    "qed-lsp-server",
    "qed-parser",
    "qed-utils",
    "qed-common",
    "qed-vm",
    "qed-repl",
    "qed-ast",
    "qed-opt",
    "qed-derive",
    "qed-sema",
    "qed-store",
    "qed-irgen",
    "qed-codegen",
    "qed-lexer",
    "qed-interpreter",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
miette = { version = "7.2", features = ["fancy"] }
thiserror = "2.0"
dotenv = "0.15"

once_cell = "1.19"
smol_str = "0.3"
thin-vec = "0.2"
smallvec = { version = "1.7", default-features = false, features = [
    "union",
    "const_new",
    "const_generics",
] }
indexmap = "2.6"
bitflags = { version = "2.0", default-features = false }
id-arena = "2.2"
unescaper = "0.1"

petgraph = "0.7"
chalk = "0.1"
ena = "0.14"

syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"
quote = "1.0"

num-traits = "0.2"
num-bigint = { version = "0.1" }
num = { version = "0.1", default-features = false }
num-integer = { version = "0.1", default-features = false }
ruint = { version = "1.12", default-features = false, features = [
    "serde",
    "num-bigint",
] }
clap = { version = "4.4", features = ["derive", "env"] }

rayon = { version = "1.10" }

hex = "0.4"
bytes = "1.7.0"
hashbrown = "0.15"

colored = "3"

bincode = "1.3"
enum-as-inner = "0.6"
strum = { version = "0.26", features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = [
    "arbitrary_precision",
    "alloc",
] }
serde_with = { version = "3.8", default-features = false, features = [
    "macros",
    "hex",
] }
serde_repr = "0.1"

plonky2 = { git = "https://github.com/QEDProtocol/plonky2-hwa", rev = "5e8d6a22cdc12e6e1e4928da1f877fc659d0304c" }
plonky2_maybe_rayon = { git = "https://github.com/QEDProtocol/plonky2-hwa", rev = "5e8d6a22cdc12e6e1e4928da1f877fc659d0304c", default-features = false }

tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["std", "env-filter"] }

sha3 = { version = "0.10", default-features = false }
blake2 = { version = "0.10", default-features = false }
blake3 = { version = "1.5", default-features = false }
tiny-keccak = { version = "2.0", features = ["sha3", "keccak"] }
twox-hash = "1.6"
k256 = { version = "0.13", features = [
    "arithmetic",
    "ecdsa",
    "pkcs8",
    "precomputed-tables",
    "schnorr",
    "signature",
    "std",
    "serde",
] }

lalrpop-util = { version = "0.22", features = ["lexer", "unicode"] }
lalrpop = "0.22"

walkdir = "2.5"
insta = { version = "1.40", features = ["glob"] }
home = { version = "0.5" }

tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
tower-lsp = "0.20"
lsp-server = "0.7"
lsp-types = "0.97"

nom = "8.0"
logos = "0.14"
ariadne = { version = "0.5.0", features = ["auto-color"] }

either = "1"
once-cell = "1.0"
llvm-sys = "191.0"
melior = { version = "0.21", features = ["ods-dialects"] }
mlir-sys = { version = "0.4" }

qedlang_core = { git = "ssh://git@github.com/QEDProtocol/qedlang-rust", branch = "feat/qed-lang" }
qed_crypto = { git = "ssh://git@github.com/QEDProtocol/qedlang-rust", branch = "feat/qed-lang" }
qed_exec = { git = "ssh://git@github.com/QEDProtocol/qedlang-rust", branch = "feat/qed-lang" }
qed_store = { git = "ssh://git@github.com/QEDProtocol/qedlang-rust", branch = "feat/qed-lang" }
qed_data = { git = "ssh://git@github.com/QEDProtocol/qedlang-rust", branch = "feat/qed-lang" }
qed_core = { git = "ssh://git@github.com/QEDProtocol/qedlang-rust", branch = "feat/qed-lang" }
qed_prover = { git = "ssh://git@github.com/QEDProtocol/qedlang-rust", branch = "feat/qed-lang" }
qed_common_circuit = { git = "ssh://git@github.com/QEDProtocol/qedlang-rust", branch = "feat/qed-lang" }
kvq = { git = "ssh://git@github.com/QEDProtocol/qedlang-rust", branch = "feat/qed-lang" }
