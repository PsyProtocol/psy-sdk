version: '3.7'
services:
  redis:
    image: redis
    volumes:
      - "./redis-data:/data"
    ports:
      - 6379:6379
    networks:
      testing_net:
        ipv4_address: 172.16.238.13
    restart: always

  coordinator-processor:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - "coordinator-processor"
      - "--coordinator-redis-uri=redis://172.16.238.13:6379"
    volumes:
      - "./db:/qed-rollup/db"
    networks:
      testing_net:
        ipv4_address: 172.16.238.14
    restart: always
    depends_on:
      - redis

  coordinator-edge:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - "coordinator-edge"
      - "--coordinator-redis-uri=redis://172.16.238.13:6379"
    volumes:
      - "./db:/qed-rollup/db"
    ports:
      - 8545:8545
    networks:
      testing_net:
        ipv4_address: 172.16.238.15
    restart: always
    depends_on:
      - redis
      - coordinator-processor
    stop_grace_period: 100ms

  coordinator-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - "coordinator-worker"
      - "--coordinator-redis-uri=redis://172.16.238.13:6379"
    networks:
      testing_net:
        ipv4_address: 172.16.238.16
    restart: always
    depends_on:
      - redis

  realm-processor:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - "realm-processor"
      - "--redis-uri=redis://172.16.238.13:6379"
    volumes:
      - "./db:/qed-rollup/db"
    networks:
      testing_net:
        ipv4_address: 172.16.238.17
    restart: always
    depends_on:
      - redis

  realm-edge:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - "realm-edge"
      - "--redis-uri=redis://172.16.238.13:6379"
      - "--coordinator-addr=http://172.16.238.15:8545"
    volumes:
      - "./db:/qed-rollup/db"
    ports:
      - 8546:8546
    networks:
      testing_net:
        ipv4_address: 172.16.238.18
    restart: always
    depends_on:
      - redis
      - realm-processor
    stop_grace_period: 100ms

  realm-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - "realm-worker"
      - "--redis-uri=redis://172.16.238.13:6379"
    networks:
      testing_net:
        ipv4_address: 172.16.238.19
    restart: always
    depends_on:
      - redis

  realm-processor1:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - "realm-processor"
      - "--redis-uri=redis://172.16.238.13:6379"
      - "--node-id=2"
      - "--realm-id=1"
      - "--worker-queue-suffix=rwq2"
      - "--notifications-queue-suffix=rnq2"
      - "--proof-store-key-suffix=RP1"
      - "--path=./db/realm1"
    volumes:
      - "./db:/qed-rollup/db"
    networks:
      testing_net:
        ipv4_address: 172.16.238.20
    restart: always
    depends_on:
      - redis

  realm-edge1:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - "realm-edge"
      - "--listen-addr=0.0.0.0:8547"
      - "--redis-uri=redis://172.16.238.13:6379"
      - "--coordinator-addr=http://172.16.238.15:8545"
      - "--node-id=2"
      - "--realm-id=1"
      - "--worker-queue-suffix=rwq2"
      - "--notifications-queue-suffix=rnq2"
      - "--proof-store-key-suffix=RP1"
      - "--path=./db/realm1"
    volumes:
      - "./db:/qed-rollup/db"
    ports:
      - 8547:8547
    networks:
      testing_net:
        ipv4_address: 172.16.238.21
    restart: always
    depends_on:
      - redis
      - realm-processor

  realm-worker1:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      - "realm-worker"
      - "--redis-uri=redis://172.16.238.13:6379"
      - "--worker-queue-suffix=rwq2"
      - "--notifications-queue-suffix=rnq2"
      - "--proof-store-key-suffix=RP1"
    networks:
      testing_net:
        ipv4_address: 172.16.238.22
    restart: always
    depends_on:
      - redis

networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.16.238.0/24
