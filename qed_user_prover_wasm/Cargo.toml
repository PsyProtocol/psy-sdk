[package]
name = "qed_user_prover_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Core QED dependencies
qed_user_cli = { workspace = true }
qed_user_prover = { workspace = true }
qed_core = { workspace = true }
qed_crypto = { workspace = true }
qed_data = { workspace = true }
qed_common_circuit = { workspace = true }
qedlang_core = { workspace = true }

# Plonky2 dependencies
plonky2 = { workspace = true }

# WebAssembly dependencies
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Worker",
  "MessageEvent",
  "MessagePort",
  "DedicatedWorkerGlobalScope",
  "WorkerGlobalScope",
  "Performance",
  "Window",
  "Document",
]}
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

# Async runtime for WASM
wasm-bindgen-rayon = { version = "1.0", optional = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
log = "0.4"
console_error_panic_hook = { version = "0.1", optional = true }
wasm-logger = { version = "0.2", optional = true }

# Utilities
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
rand = { version = "0.8", features = ["getrandom"] }
hashbrown = "0.14"

[features]
default = ["console_error_panic_hook", "wasm-logger"]
parallel = ["wasm-bindgen-rayon"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
wasm-logger = ["dep:wasm-logger"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]