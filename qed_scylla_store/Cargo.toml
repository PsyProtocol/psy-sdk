[package]
edition = "2021"
name    = "qed_scylla_store"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow     = { workspace = true }
bincode      = { workspace = true }
serde      = { workspace = true }
serde_json      = { workspace = true }
serde_repr      = { workspace = true }
serde_with = { workspace = true }
hex = { workspace = true }
hex-literal = { workspace = true }
lazy_static = { workspace = true }
plonky2 = { workspace = true }
twox-hash = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

kvq = { path = "../kvq" }
qed_core = { path = "../qed_core" }
qed_node = { path = "../qed_node" }
qed_common_circuit = { path = "../qed_common_circuit" }
qed_rollup_circuit = { path = "../qed_rollup_circuit" }
qed_data = { path = "../qed_data" }
qed_crypto = { path = "../qed_crypto" }
qed_store = { path = "../qed_store" }
qed_node_common = { path = "../qed_node_common" }

rand = { workspace = true }
log = { workspace = true }

tokio = { version = "1.43.0", features = ["full"] }

futures = "0.3.0"
tokio-executor-trait = "2.1.3"
rabbitmq-stream-client = "0.8.0"
tokio-reactor-trait = "1.1.0"
fred = "10.0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
scylla = "0.15.1"
