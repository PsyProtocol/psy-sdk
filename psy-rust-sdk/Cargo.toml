[package]
edition = "2021"
name = "psy_rust_sdk"
version = "0.1.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
plonky2 = { workspace = true }
tracing = { workspace = true }

psy_common = { workspace = true }
psy_config = { workspace = true }
psy_data = { workspace = true, default-features = false }
psy_crypto = { workspace = true }
psy_vm = { workspace = true, default-features = false }

wasm-bindgen = { workspace = true }
console_error_panic_hook = { workspace = true }
wasm-logger = { workspace = true }
wasm-tracing = { workspace = true }
web-sys = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
serde-wasm-bindgen = { workspace = true }

psy_provider = { workspace = true }
psy_prover = { workspace = true }
psy_common_circuit = { workspace = true }
psy_dpn_circuit = { workspace = true }
psy_ups_circuit = { workspace = true }

base64 = { workspace = true }
bincode = { workspace = true }
anyhow = "1"

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "1.3", optional = true }
reqwest = { workspace = true, features = ["json"] }
getrandom = { workspace = true, features = ["wasm_js"] }

[features]
# default = ["is_sync"]
# A rayon thread pool on Web Workers (wasm-bindgen-rayon): JS calls `initThreadPool(n)` after
# init. Needs cross-origin isolation (SharedArrayBuffer). `threads-no-bundler` for pages that
# load the module without a bundler (the lab harness).
threads = ["dep:wasm-bindgen-rayon"]
threads-no-bundler = ["threads", "wasm-bindgen-rayon/no-bundler"]
is_sync = ["psy_data/is_sync", "psy_vm/is_sync"]
