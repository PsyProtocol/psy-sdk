services:
  pd0:
    image: pingcap/pd:latest
    container_name: tikv-pd0
    command:
      - --name=pd0
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd0:2379
      - --advertise-peer-urls=http://pd0:2380
      - --initial-cluster=pd0=http://pd0:2380,pd1=http://pd1:2380,pd2=http://pd2:2380
      - --data-dir=/var/lib/pd
      - --log-file=/var/log/pd.log
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - pd0:/var/lib/pd
    networks:
      - tikv

  pd1:
    image: pingcap/pd:latest
    container_name: tikv-pd1
    command:
      - --name=pd1
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd1:2379
      - --advertise-peer-urls=http://pd1:2380
      - --initial-cluster=pd0=http://pd0:2380,pd1=http://pd1:2380,pd2=http://pd2:2380
      - --data-dir=/var/lib/pd
      - --log-file=/var/log/pd.log
    ports:
      - "2381:2379"
      - "2382:2380"
    volumes:
      - pd1:/var/lib/pd
    networks:
      - tikv

  pd2:
    image: pingcap/pd:latest
    container_name: tikv-pd2
    command:
      - --name=pd2
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd2:2379
      - --advertise-peer-urls=http://pd2:2380
      - --initial-cluster=pd0=http://pd0:2380,pd1=http://pd1:2380,pd2=http://pd2:2380
      - --data-dir=/var/lib/pd
      - --log-file=/var/log/pd.log
    
    ports:
      - "2383:2379"
      - "2384:2380"
    volumes:
      - pd2:/var/lib/pd
    networks:
      - tikv

  tikv0:
    image: pingcap/tikv:latest
    container_name: tikv-server0
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv0:20160
      - --data-dir=/var/lib/tikv
      - --pd-endpoints=pd0:2379,pd1:2379,pd2:2379
      - --log-file=/var/log/tikv.log
    ports:
      - "20160:20160"
    volumes:
      - tikv0:/var/lib/tikv
    networks:
      - tikv
    depends_on:
      - pd0
      - pd1
      - pd2

  tikv1:
    image: pingcap/tikv:latest
    container_name: tikv-server1
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv1:20160
      - --data-dir=/var/lib/tikv
      - --pd-endpoints=pd0:2379,pd1:2379,pd2:2379
      - --log-file=/var/log/tikv.log
    ports:
      - "20161:20160"
    volumes:
      - tikv1:/var/lib/tikv
    networks:
      - tikv
    depends_on:
      - pd0
      - pd1
      - pd2

  tikv2:
    image: pingcap/tikv:latest
    container_name: tikv-server2
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv2:20160
      - --data-dir=/var/lib/tikv
      - --pd-endpoints=pd0:2379,pd1:2379,pd2:2379
      - --log-file=/var/log/tikv.log
    ports:
      - "20162:20160"
    volumes:
      - tikv2:/var/lib/tikv
    networks:
      - tikv
    depends_on:
      - pd0
      - pd1
      - pd2

volumes:
  pd0:
  pd1:
  pd2:
  tikv0:
  tikv1:
  tikv2:

networks:
  tikv:
    driver: bridge