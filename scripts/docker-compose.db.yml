services:
  redis-coordinator:
    image: redis:alpine
    container_name: qed-redis-coordinator
    network_mode: host
    command:
      - redis-server
      - --port
      - "6379"
      - --save
      - ""
    restart: unless-stopped

  redis-realm0:
    image: redis:alpine
    container_name: qed-redis-realm0
    network_mode: host
    command:
      - redis-server
      - --port
      - "6380"
      - --save
      - ""
    restart: unless-stopped

  redis-realm1:
    image: redis:alpine
    container_name: qed-redis-realm1
    network_mode: host
    command:
      - redis-server
      - --port
      - "6381"
      - --save
      - ""
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: qed-timescaledb
    network_mode: host
    environment:
      - POSTGRES_PASSWORD=password
    restart: unless-stopped