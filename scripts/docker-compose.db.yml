services:
  redis-all:
    image: redis:alpine
    container_name: qed-redis-coordinator
    network_mode: host
    command:
      - redis-server
      - --port
      - "6379"
      - --appendonly
      - "yes"
      - --appendfsync
      - "everysec"
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - "64mb"
      - --save
      - "60 1"
      - --dir
      - "/data"
    volumes:
      - ./target/redis-all:/data
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: qed-timescaledb
    network_mode: host
    environment:
      - POSTGRES_PASSWORD=password
    restart: unless-stopped