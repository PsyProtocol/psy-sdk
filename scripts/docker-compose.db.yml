services:
  redis-data:
    image: redis:alpine
    container_name: psy-redis-coordinator
    network_mode: host
    volumes:
      - ${PWD}/db/redis-coordinator:/data
    command:
      - redis-server
      - --port
      - "6379"
      - --save
      - "60 1"
      - --appendonly
      - "yes"
      - --dir
      - "/data"
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: psy-timescaledb
    network_mode: host
    environment:
      - POSTGRES_PASSWORD=password
    restart: unless-stopped